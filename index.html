<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2b2c" />
    <meta name="description" content="InsureFlow AI demo – an agentic short-term insurance brokerage. BCovered is a fictional brokerage; all data is synthetic." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f3d3e'/><path d='M16 6l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V9z' fill='%23f5b841'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <title>BCovered on InsureFlow AI | Agentic insurance brokerage demo</title>
    <style>
      /* Shown from the first paint until React mounts and replaces #root's contents. */
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #faf7f2; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0f3d3e; }
      .boot-mark { width: 56px; height: 56px; }
      .boot-name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      .boot-name span { color: #e39f1c; }
      .boot-bar { width: 140px; height: 4px; border-radius: 9999px; background: #d5ebe8; overflow: hidden; }
      .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit; background: #1f7a74; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot-note { font-size: 12px; color: #3d5a85; }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <svg class="boot-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0f3d3e" /><path d="M16 6l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V9z" fill="#f5b841" /></svg>
        <div class="boot-name">B<span>Covered</span></div>
        <div class="boot-bar"></div>
        <div class="boot-note">Loading the InsureFlow AI demo…</div>
      </div>
    </div>
    <noscript>BCovered needs JavaScript to run the demo.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
